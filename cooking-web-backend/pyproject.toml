[project]
name = "cooking-web-backend"
version = "0.1.0"
description = "FastAPI backend for cooking-web"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.3.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]
